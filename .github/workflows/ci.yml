name: Moonlight FFI smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - tools/moonlight-ffi-smoke/**

permissions:
  contents: read

concurrency:
  group: moonlight-ffi-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffi-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out execution harness
        uses: actions/checkout@v4

      - name: Check out immutable Moonlight release
        uses: actions/checkout@v4
        with:
          repository: PaleRoses/moonlight
          ref: moonlight-triangulation-1.3.0.3
          path: release
          fetch-depth: 1

      - name: Verify source receipt
        run: |
          test "$(git -C release rev-parse HEAD)" = "8af59473c0b51efc4d158e012e5c3493d2b0412c"
          grep -F 'version:             1.3.0.3' release/moonlight-triangulation/moonlight-triangulation.cabal

      - name: Cache Haskell dependencies
        id: cabal-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            release/dist-newstyle
          key: ${{ runner.os }}-moonlight-ffi-ghc-9.14.1-cabal-3.16.1.0-release-1.3.0.3-${{ hashFiles('release/moonlight-triangulation/**') }}
          restore-keys: |
            ${{ runner.os }}-moonlight-ffi-ghc-9.14.1-cabal-3.16.1.0-
          save-always: true

      - name: Install GHC and cabal-install
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.16.1.0"
          cabal-update: ${{ steps.cabal-cache.outputs.cache-hit == '' }}

      - name: Build canonical shared C ABI
        working-directory: release
        run: >-
          cabal build
          moonlight-triangulation:flib:moonlight-triangulation-c
          --enable-shared
          -j2

      - name: Compile and execute standalone C consumer
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t libraries < <(
            find release/dist-newstyle \
              -name 'libmoonlight-triangulation-c.so.2' \
              -print
          )
          if [[ "${#libraries[@]}" -ne 1 ]]; then
            printf 'expected one versioned foreign library, found %d\n' \
              "${#libraries[@]}" >&2
            printf '%s\n' "${libraries[@]}" >&2
            find release/dist-newstyle \
              -name 'libmoonlight-triangulation-c.so*' \
              -ls >&2
            exit 1
          fi

          library="$(realpath -e "${libraries[0]}")"
          library_directory="$(dirname "$library")"
          dynamic_library_path="$(
            find release/dist-newstyle "$HOME/.cabal/store" \
              \( -type f -o -type l \) \
              \( -name '*.so' -o -name '*.so.*' \) \
              -printf '%h\n' \
              | sort -u \
              | paste -sd: -
          )"

          printf 'shared_library=%s\n' "$library" | tee ffi-smoke-library.txt
          env LD_LIBRARY_PATH="$dynamic_library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ldd "$library" \
            | tee ffi-smoke-library-ldd.txt

          gcc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -I release/moonlight-triangulation/include \
            tools/moonlight-ffi-smoke/ffi_smoke.c \
            "$library" \
            -Wl,-rpath,"$library_directory" \
            -Wl,--allow-shlib-undefined \
            -pthread \
            -o tools/moonlight-ffi-smoke/ffi_smoke

          LD_LIBRARY_PATH="$dynamic_library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            tools/moonlight-ffi-smoke/ffi_smoke \
            | tee ffi-smoke-output.txt

          env LD_LIBRARY_PATH="$dynamic_library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ldd tools/moonlight-ffi-smoke/ffi_smoke \
            | tee ffi-smoke-executable-ldd.txt

      - name: Assemble and re-run relocatable proof bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle="tools/moonlight-ffi-smoke/bundle"
          mkdir -p "$bundle/lib"
          cp tools/moonlight-ffi-smoke/ffi_smoke "$bundle/"
          cp tools/moonlight-ffi-smoke/ffi_smoke.c "$bundle/"
          cp release/moonlight-triangulation/include/moonlight_triangulation.h "$bundle/"
          cp \
            ffi-smoke-output.txt \
            ffi-smoke-library.txt \
            ffi-smoke-library-ldd.txt \
            ffi-smoke-executable-ldd.txt \
            "$bundle/"

          awk '
            $2 == "=>" && $3 ~ /^\// { print $3 }
            $1 ~ /^\// { print $1 }
          ' ffi-smoke-executable-ldd.txt \
            | sort -u \
            | while IFS= read -r dependency; do
                case "$dependency" in
                  /lib/*|/usr/lib/*) ;;
                  *) cp -L "$dependency" "$bundle/lib/$(basename "$dependency")" ;;
                esac
              done

          cat > "$bundle/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "$0")" && pwd)"
          LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$here/ffi_smoke"
          EOF
          chmod +x "$bundle/run.sh"

          cat > "$bundle/README.md" <<'EOF'
          # moonlight-triangulation C ABI execution proof

          Built from public tag `moonlight-triangulation-1.3.0.3`, commit
          `8af59473c0b51efc4d158e012e5c3493d2b0412c`.

          The standalone C program initializes the Haskell runtime, constructs
          and exports a Delaunay mesh, intersects exact planar regions, checks
          exact area and point location, and frees every opaque handle.

          Run `./run.sh` on a compatible x86-64 Linux system.
          EOF

          (
            cd "$bundle"
            ./run.sh | tee bundled-output.txt
          )
          grep -Fx 'ffi_smoke=PASS' "$bundle/bundled-output.txt"

          tar -czf moonlight-triangulation-ffi-smoke-linux-x86_64.tar.gz \
            -C "$bundle" .

      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-triangulation-ffi-smoke-linux-x86_64
          path: |
            ffi-smoke-output.txt
            ffi-smoke-library.txt
            ffi-smoke-library-ldd.txt
            ffi-smoke-executable-ldd.txt
            moonlight-triangulation-ffi-smoke-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
